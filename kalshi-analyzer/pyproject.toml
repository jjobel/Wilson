[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-analyzer"
version = "0.1.0"
description = "Kalshi prediction market bet analyzer — finds hot markets, gathers multi-source evidence, and recommends top bets via Claude AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10.0",
    "vaderSentiment>=3.3.2",
    "praw>=7.7.0",
    "rich>=13.7.0",
    "plotext>=5.2.0",
    "tweepy>=4.14.0",
]

[project.optional-dependencies]
financial = [
    "yfinance>=0.2.0",   # Financial macro context; install separately if needed
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
all = [
    "yfinance>=0.2.0",
]

[project.scripts]
kalshi-analyzer = "kalshi_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kalshi_analyzer*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
