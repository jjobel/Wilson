# Kalshi Analyzer — example configuration
# Copy to config.yaml and fill in your API keys / preferences.
# All values shown are the defaults; omit any section to use the default.

markets:
  days_ahead: 7          # Only analyze markets closing within N days
  hot_candidates: 20     # Top N markets to deeply enrich
  top_recommendations: 5 # Final recommendations to display
  min_volume: 100        # Skip illiquid markets

sources:
  kalshi:
    enabled: true

  polymarket:
    enabled: true

  news:
    enabled: true
    max_articles: 10

  sentiment:
    enabled: true
    reddit_post_limit: 25     # Reddit posts per subreddit
    twitter_tweet_limit: 100  # X/Twitter tweets to analyze
    twitter_min_likes: 10     # Filter out low-engagement tweets

  odds:
    enabled: true             # Requires ODDS_API_KEY env var

  financial:
    enabled: true             # Uses yfinance (no auth required)

ranking:
  weights:
    volume: 0.35
    open_interest: 0.25
    time_urgency: 0.20
    price_uncertainty: 0.20

analysis:
  weights:
    edge_score: 0.30
    sentiment_alignment: 0.20
    market_consensus: 0.20
    vegas_alignment: 0.15
    liquidity_score: 0.10
    time_sensitivity: 0.05

anthropic:
  model: claude-sonnet-4-6
  max_tokens: 2048

notifier:
  backend: console   # "console" or "discord"

schedule:
  cron: "0 8 * * *"  # Run daily at 8am

# Environment variables (never put actual keys here):
# ANTHROPIC_API_KEY      — Required for Claude analysis
# KALSHI_API_KEY_ID      — Optional: Kalshi private data
# KALSHI_PRIVATE_KEY     — Optional: Kalshi private data
# NEWS_API_KEY           — Optional: NewsAPI (GDELT is always free)
# ODDS_API_KEY           — Optional: The Odds API (Vegas lines)
# TWITTER_BEARER_TOKEN   — Optional: X/Twitter sentiment
# DISCORD_WEBHOOK_URL    — Optional: Discord notifications
